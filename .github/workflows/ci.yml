name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # pgvector y pg_trgm hacen falta para las migraciones, asi que usamos la
      # misma imagen que en desarrollo en vez del postgres pelado.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docuflow
          POSTGRES_PASSWORD: docuflow
          POSTGRES_DB: docuflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docuflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://docuflow:docuflow@localhost:5432/docuflow_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Habilitar extensiones
        run: |
          PGPASSWORD=docuflow psql -h localhost -U docuflow -d docuflow_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Lint
        run: ruff check app scripts tests

      - name: Formato
        run: ruff format --check app scripts tests

      # Estos dos pasos existen por bugs que se colaron a produccion: un indice
      # sobre una columna que el modelo no declaraba, y un ENUM creado dos
      # veces. Los dos habrian muerto aca.
      - name: Migraciones y deriva de esquema
        run: pytest tests/test_migrations.py tests/test_schema_drift.py -v

      - name: Logica de extraccion
        run: pytest tests/test_extraction.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
